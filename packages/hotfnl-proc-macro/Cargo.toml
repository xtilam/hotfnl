[package]
name = "hotfnl-proc-macro"
description = "Proc macro for hotfnl"
version = "0.1.2" 
repository.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true


[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "fold"] }

[features]
default = []
prod = []
