[package]
name = "hotfnl"
version = "0.1.0"
edition = "2024"
authors = ["ztilam60@gmail.com"]
description = "A lightweight Rust library for dynamic library patching and hot-reloading on Linux"
license = "MIT"
repository = "https://github.com/xtilam/hotfnl"

[workspace]
members = ["hot-macro"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
libloading = { version = "0.9.0", optional = true }
notify = { version = "8.2.0", optional = true }
toml = { version = "1.1.4", optional = true }
anyhow = { version = "1.0.104" }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
hot-macro = { version = "0.1.0", path = "hot-macro", optional = true }
paste = "1.0.15"
crossbeam-channel = { version = "0.5.16", optional = true }

[features]
default = [
  "dep:crossterm",
  "dep:libloading",
  "dep:notify",
  "dep:toml",
  "dep:serde",
  "dep:crossbeam-channel",
  "hot-macro/default",
]

prod = ["hot-macro/prod"]
