[package]
name = "hotfnl"
description = "A lightweight Rust library for dynamic library patching and hot-reloading on Linux"
edition = "2024"
version = "0.3.0"
repository.workspace = true
license.workspace = true
authors.workspace = true

[workspace.package]
repository = "https://github.com/xtilam/hotfnl"
license = "MIT"
authors = ["ztilam60@gmail.com"]

[workspace]
members = [
  "packages/hotfnl-proc-macro",
  "example/ratatui-app",
  "example/iced-counter",
]

[workspace.dependencies]
crossterm = { version = "0.29.0" }
libloading = { version = "0.9.0" }
notify = { version = "8.2.0" }
toml = { version = "1.1.4" }
anyhow = { version = "1.0.104" }
serde = { version = "1.0.229", features = ["derive"] }
paste = { version = "1.0.15" }
crossbeam-channel = { version = "0.5.16" }
inventory = "0.3.24"
postcard = { version = "1.1.3", features = ["alloc"] }
hotfnl-proc-macro = { version = "0.3.0", path = "packages/hotfnl-proc-macro" }

[dependencies]
libloading = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
paste = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
inventory = { workspace = true }
postcard = { workspace = true }
hotfnl-proc-macro.workspace = true

[profile.dev]
debug = 0
strip = true
