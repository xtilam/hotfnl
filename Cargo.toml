[package]
name = "hotfnl"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["hot-macro"]

[workspace.dependencies]
inventory = { version = "0.3.24" }

[dependencies]
crossterm = { version = "0.29.0", optional = true }
inventory = { workspace = true, optional = true }
libloading = { version = "0.9.0", optional = true }
notify = { version = "8.2.0", optional = true }
toml = { version = "1.1.4", optional = true }
anyhow = { version = "1.0.104" }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
hot-macro = { version = "0.1.0", path = "hot-macro", optional = true }

[features]
default = [
  "dep:crossterm",
  "dep:inventory",
  "dep:libloading",
  "dep:notify",
  "dep:toml",
  "dep:serde",
  "hot-macro/default",
]

prod = ["hot-macro/prod"]
