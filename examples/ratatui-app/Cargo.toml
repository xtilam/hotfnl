[package]
name = "ratatui-app"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
ratatui = "0.30.2"
hotfnl = { path = "../../" }
inventory = "0.3.24"
crossterm = "0.29.0"
vte = "0.15.0"
portable-pty = "0.9.0"
anyhow = "1.0.104"
